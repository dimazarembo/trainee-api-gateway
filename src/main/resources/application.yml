spring:
  application:
    name: trainee-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: http://localhost:8080
              predicates:
                - Path=/users/**,/cards/**
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**,/items/**
server:
  port: ${SERVER_PORT:8084}

services:
  auth:
    base-url: http://localhost:8081
  user:
    base-url: http://localhost:8080