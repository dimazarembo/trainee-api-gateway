server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/users/**,/cards/**
            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/orders/**,/items/**

services:
  auth:
    base-url: http://auth-service:8080
  user:
    base-url: http://user-service:8080