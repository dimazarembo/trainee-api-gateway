services:
  api-gateway:
    image: ${API_GATEWAY_IMAGE}
    depends_on:
      user-service:
        condition: service_started
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080

  user-service:
    image: ${USER_SERVICE_IMAGE}
    depends_on:
      user-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_URL: jdbc:postgresql://user-postgres:5432/${USER_POSTGRES_DB}
      DB_USER: ${USER_POSTGRES_USER}
      DB_PASSWORD: ${USER_POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  auth-service:
    image: ${AUTH_SERVICE_IMAGE}
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_POSTGRES_DB}
      DB_USER: ${AUTH_POSTGRES_USER}
      DB_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}

  order-service:
    image: ${ORDER_SERVICE_IMAGE}
    depends_on:
      order-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_URL: jdbc:postgresql://order-postgres:5432/${ORDER_POSTGRES_DB}
      DB_USER: ${ORDER_POSTGRES_USER}
      DB_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      USER_SERVICE_BASE_URL: http://user-service:8080
      USER_SERVICE_AUTH_USER_ID: 0
      USER_SERVICE_AUTH_ROLE: ADMIN
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  payment-service:
    image: ${PAYMENT_SERVICE_IMAGE}
    depends_on:
      payment-mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_MONGODB_URI: mongodb://${PAYMENT_MONGO_ROOT_USERNAME}:${PAYMENT_MONGO_ROOT_PASSWORD}@payment-mongodb:27017/${PAYMENT_MONGO_DATABASE}?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  user-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PAYMENT_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${PAYMENT_MONGO_DATABASE}
    volumes:
      - payment_mongodb_data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

volumes:
  user_postgres_data:
  auth_postgres_data:
  order_postgres_data:
  redis_data:
  payment_mongodb_data:
  kafka_data:
