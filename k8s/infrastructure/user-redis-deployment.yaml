apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-redis
  namespace: trainee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-redis
  template:
    metadata:
      labels:
        app: user-redis
    spec:
      containers:
        - name: user-redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trainee-secrets
                  key: REDIS_PASSWORD
          command:
            - redis-server
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"