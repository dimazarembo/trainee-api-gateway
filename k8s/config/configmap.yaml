apiVersion: v1
kind: ConfigMap
metadata:
  name: trainee-config
  namespace: trainee
data:
  SPRING_PROFILES_ACTIVE: "docker"

  AUTH_DB_URL: "jdbc:postgresql://auth-postgres:5432/auth_service_db"
  AUTH_DB_NAME: "auth_service_db"

  USER_DB_URL: "jdbc:postgresql://user-postgres:5432/user_service_db"
  USER_DB_NAME: "user_service_db"

  REDIS_HOST: "user-redis"
  REDIS_PORT: "6379"

  ORDER_DB_URL: "jdbc:postgresql://order-postgres:5432/order_service_db"
  ORDER_DB_NAME: "order_service_db"
  USER_SERVICE_AUTH_USER_ID: "0"
  USER_SERVICE_AUTH_ROLE: "ADMIN"

  PAYMENT_MONGO_DATABASE: "payment_db"

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  API_GATEWAY_SERVER_PORT: "8080"
  AUTH_SERVICE_BASE_URL: "http://auth-service:8080"
  USER_SERVICE_BASE_URL: "http://user-service:8080"